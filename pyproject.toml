[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mac_sop_comparator"
version = "0.1.0"
description = "Comparación de eficiencia teórica MAC vs SOP entre una ANN densa y una SNN LIF sobre firmas moleculares."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Cob Beirute" }]
requires-python = ">=3.13"
dependencies = [
    "torch>=2.14",
    "snntorch>=1.0",
    "rdkit>=2026.3",
    "numpy>=2.5",
    "pandas>=3.0",
    "pydantic>=2.13",
    "scikit-learn>=1.9",
    "scipy>=1.18",
    "pyyaml>=6.0",
    "matplotlib>=3.11",
    "certifi",
]

[project.optional-dependencies]
dev = ["pytest>=9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
